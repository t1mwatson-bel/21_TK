<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Букмекер</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ...ТУТ БУДЕТ CSS ИЗ ПРЕДЫДУЩЕГО СООБЩЕНИЯ... (я его сократил для ответа, но ты вставь тот, что я давал выше) ... */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #1e2124; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* ШАПКА */
        header { background-color: #2b2f33; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a3f44; }
        .header-title { font-size: 18px; font-weight: 500; color: #a0a0a0; }
        .balance { color: #e5972c; font-weight: bold; font-size: 16px; }

        /* КОНТЕНТ */
        .content { padding: 15px; flex: 1; overflow-y: auto; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .game-card { background-color: #2b2f33; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .game-header { display: flex; justify-content: space-between; font-size: 12px; color: #a0a0a0; }
        
        /* КАРТЫ */
        .cards-row { display: flex; gap: 5px; }
        .card { background: #fff; color: #000; border-radius: 4px; padding: 4px 6px; font-size: 12px; font-weight: bold; }
        .card.red { color: #d32f2f; }
        
        .vs-block { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; font-weight: bold; font-size: 14px;}
        .score { font-size: 16px; color: #e5972c; }

        /* КНОПКА СТАВКИ */
        .bet-btn { background-color: #3a3f44; border: none; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; display: flex; justify-content: space-between; font-weight: bold; }
        .bet-btn:hover { background-color: #4a4f54; }
        .bet-btn .coef { color: #e5972c; }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav { background-color: #2b2f33; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #3a3f44; position: relative; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #777; font-size: 12px; gap: 4px; }
        .nav-item.active { color: #e5972c; }
        
        /* МОДАЛКА СТАВКИ */
        .modal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #2b2f33; border-radius: 15px 15px 0 0; padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 100; }
        .modal.active { display: block; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99; }
        .modal-overlay.active { display: block; }

        .input-group { margin: 15px 0; }
        .input-group input { width: 100%; padding: 12px; background: #1e2124; border: 1px solid #3a3f44; color: #fff; border-radius: 6px; font-size: 16px; }
        
        .btn-primary { background: #e5972c; color: #fff; border: none; padding: 15px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">Мой Букмекер</div>
        <div class="balance" id="balance">0 ₽</div>
    </header>

    <div class="content">
        <div class="grid" id="games-grid">
            <!-- Сюда будут падать карточки -->
        </div>
    </div>

    <!-- МОДАЛКА СТАВКИ -->
    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="bet-modal">
        <h3 style="margin-bottom: 15px;" id="modal-title">Ставка</h3>
        <div style="color: #a0a0a0; font-size: 14px; margin-bottom: 10px;" id="modal-game">Игра #</div>
        
        <div class="input-group">
            <input type="number" id="bet-amount" placeholder="Сумма в ₽" value="100">
        </div>
        <div style="font-size: 12px; color: #a0a0a0; margin-bottom: 15px;">
            Возможный выигрыш: <span id="possible-win" style="color: #e5972c;">190 ₽</span>
        </div>
        
        <button class="btn-primary" onclick="placeBet()">Поставить</button>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-fire"></i><span>Популярное</span></div>
        <div class="nav-item"><i class="fa-solid fa-star"></i><span>Избранное</span></div>
        <div class="nav-item"><i class="fa-solid fa-ticket"></i><span>Купон</span></div>
        <div class="nav-item"><i class="fa-regular fa-clock"></i><span>История</span></div>
    </div>

    <script>
        let currentBalance = 0;
        let currentGameId = null;
        let currentSuit = null;

        // Форматирование карт
        function renderCards(cards) {
            return cards.map(c => {
                const isRed = c.includes('♥') || c.includes('♦');
                return `<span class="card ${isRed ? 'red' : ''}">${c}</span>`;
            }).join('');
        }

        // Загрузка баланса
        async function loadUser() {
            const res = await fetch('/api/user');
            const data = await res.json();
            currentBalance = data.balance;
            document.getElementById('balance').innerText = data.balance.toFixed(2) + ' ₽';
        }

        // Загрузка игр
        async function loadGames() {
            const res = await fetch('/api/games');
            const games = await res.json();
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            games.forEach(g => {
                const div = document.createElement('div');
                div.className = 'game-card';
                
                if (g.is_finished) {
                    div.innerHTML = `
                        <div class="game-header"><span>Баккара. ${g.num}</span></div>
                        <div class="cards-row">${renderCards(g.p_cards)}</div>
                        <div class="vs-block"><span class="score">${g.p_score}</span> : <span class="score">${g.d_score}</span></div>
                        <div class="cards-row" style="justify-content: flex-end;">${renderCards(g.d_cards)}</div>
                        <div style="text-align: center; font-size: 12px; color: #a0a0a0; margin-top: 5px;">Игра завершена</div>
                    `;
                } else {
                    div.innerHTML = `
                        <div class="game-header"><span>Баккара. ${g.num}</span></div>
                        <div class="vs-block">Игрок <span style="font-size:10px; color:#777">VS</span> Банкир</div>
                        <div class="cards-row" style="min-height: 20px;">${renderCards(g.p_cards)}</div>
                        <button class="bet-btn" onclick="openBetModal('${g.id}', ${g.num})">
                            <span>Масть игрока</span> <span class="coef">1.9</span>
                        </button>
                    `;
                }
                grid.appendChild(div);
            });
        }

        // Открытие модалки
        function openBetModal(gameId, gameNum) {
            currentGameId = gameId;
            document.getElementById('modal-game').innerText = `Игра #${gameNum}`;
            document.getElementById('bet-modal').classList.add('active');
            document.getElementById('overlay').classList.add('active');
            updateWin();
        }

        // Закрытие модалки
        function closeModal() {
            document.getElementById('bet-modal').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        }

        // Подсчет выигрыша
        document.getElementById('bet-amount').addEventListener('input', updateWin);
        function updateWin() {
            const amount = parseFloat(document.getElementById('bet-amount').value) || 0;
            document.getElementById('possible-win').innerText = (amount * 1.9).toFixed(0) + ' ₽';
        }

        // Ставка
        async function placeBet() {
            const amount = parseFloat(document.getElementById('bet-amount').value);
            if (amount > currentBalance) {
                alert('Недостаточно средств!');
                return;
            }

            const res = await fetch('/api/bet', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ game_id: currentGameId, suit: "any", amount: amount })
            });
            const data = await res.json();
            
            if (data.status === 'ok') {
                alert('Ставка принята!');
                closeModal();
                loadUser(); // Обновляем баланс
            } else {
                alert(data.message);
            }
        }

        // Инициализация
        loadUser();
        loadGames();
        setInterval(loadGames, 2000); // Обновляем игры каждые 2 секунды
    </script>
</body>
</html>
